name: release

# v* タグの push で Windows / Linux / macOS 向けバイナリをビルドし、
# GitHub Releases に公開します。
# GUI 依存（X11 / ALSA / GTK）を各 OS のネイティブ環境で解決するため、
# ビルドは OS ごとのランナーで行います。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: linux-amd64
            cgo: "1"
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: windows-amd64.exe
            cgo: "0"
          - os: macos-15
            goos: darwin
            goarch: arm64
            asset: darwin-arm64
            cgo: "1"
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            asset: darwin-amd64
            cgo: "1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Linux の GUI ビルド依存を導入
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev \
            libasound2-dev libgtk-3-dev xvfb

      - name: タグと VERSION の一致を検証
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(tr -d ' \t\r\n' < VERSION)"
          if [ "$tag" != "$ver" ]; then
            echo "タグ $GITHUB_REF_NAME と VERSION($ver) が一致しません" >&2
            exit 1
          fi
          echo "リリース版: v$ver"

      - name: テスト
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1024x768x24" go test .
          elif [ "${{ runner.os }}" = "macOS" ]; then
            go test -skip 'TestVMZeroAllocLoop' .
          else
            go test .
          fi

      - name: バイナリをビルド
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          set -euo pipefail
          ver="$(tr -d ' \t\r\n' < VERSION)"
          ldflags="-s -w -X main.golashVersion=$ver"
          go build -trimpath -ldflags "$ldflags" -o "gsh-$ver-${{ matrix.asset }}" .

      - name: 版を確認
        shell: bash
        run: |
          set -euo pipefail
          ver="$(tr -d ' \t\r\n' < VERSION)"
          "./gsh-$ver-${{ matrix.asset }}" version

      - name: 成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: gsh-${{ matrix.asset }}
          path: gsh-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: チェックサムを作成
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum gsh-* > "gsh-$ver-sha256.txt"
          cat "gsh-$ver-sha256.txt"

      - name: GitHub Releases へ公開
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
